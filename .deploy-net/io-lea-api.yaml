---
name: io-lea-api
octopus:
  space: USXpress
  group: io
tags:
  owner: USXpress
  team: Platform
  purpose: Job search service (internal)
infrastructure:
  auth:
    roles:
      - io-lea-reader
      - io-lea-writer
    group_roles_assignment:
      - name: Everybody
        roles:
          - io-lea-reader
          - io-lea-writer
    redirect_uri_paths:
      - path: /signin-oidc
        type: api
      - path: /swagger/oauth2-redirect.html
        type: spa
  mongodb:
    atlas:
      user:
        cluster:
          project: mongodb
          group: enterprise
          env: '#{Mongo__Env}'
        roles:
          - name: readWrite
            database: '#{Database__MainDatabaseName}'
            collection: '#{Database__JobCollection}'
  kafka:
    topics:
      - name: io:job_search_evt
        bounded_context: io
        schema_type: json
        reference: job-processing
    service_account: io
api:
  routes:
    subdomains:
      - product: io
        app: lea
        type: api
  global:
    upstream:
      perTryTimeout: 15s
  service:
    targetPort: 8080
  configVars:
    APPLICATION_ENTRYPOINT: IO.Lea.dll
    Serilog__MinimumLevel__Default: Information
    Database__MainDatabaseName: '#{Database__MainDatabaseName}'
    Database__JobCollection: '#{Database__JobCollection}'
    Database__MaxConnectionPoolSize: '#{Database__MaxConnectionPoolSize}'
    NORA_GOOGLE_MAPS_KML: '#{NORA_GOOGLE_MAPS_KML}'
  secretVars:
    AUTH__CLIENT_SECRET: '#{AUTH__CLIENT_SECRET}'
