---
name: io-larry-vendor-handler
octopus:
  space: USXpress
  group: io
tags:
  owner: USXpress
  team: Platform
  purpose: Vendor lookup background processing
infrastructure:
  kafka:
    topics:
      - name: io:vendor_lookup_evt
        bounded_context: io
        schema_type: json
        reference: vendor-processing
    service_account: io
    consumer_group:
      enabled: true
      suffix: "#{consumer_group_suffix}"
  mongodb:
    atlas:
      user:
        cluster:
          project: mongodb
          group: enterprise
          env: '#{Mongo__Env}'
        roles:
          - name: readWrite
            database: '#{Database__MainDatabaseName}'
            collection: '#{Database__VendorCollection}'
handler:
  service:
    targetPort: 8080
  configVars:
    APPLICATION_ENTRYPOINT: IO.Larry.VendorHandler.dll
    Database__MainDatabaseName: '#{Database__MainDatabaseName}'
    Database__VendorCollection: '#{Database__VendorCollection}'
    Database__MaxConnectionPoolSize: '#{Database__MaxConnectionPoolSize}'
    LARRY_XPM_API: '#{LARRY_XPM_API}'
    KAFKA__topics_config__vendor-processing__Serialization: ''
    KAFKA__topics_config__vendor-processing__TopicAutoOffsetReset: ''
  secretVars:
    LARRY_XPM_API: '#{LARRY_XPM_API}'
