---
name: io-larry-vendor-sync
octopus:
  space: USXpress
  group: io
tags:
  owner: USXpress
  team: Platform
  purpose: Scheduled vendor data synchronization
infrastructure:
  mongodb:
    atlas:
      user:
        cluster:
          project: mongodb
          group: enterprise
          env: '#{Mongo__Env}'
        roles:
          - name: readWrite
            database: '#{Database__MainDatabaseName}'
            collection: '#{Database__VendorCollection}'
cron:
  service:
    targetPort: 8080
  schedule:
    - cron: "0 */30 * * * *"  # Every 30 minutes
      timezone: "America/Chicago"
  configVars:
    APPLICATION_ENTRYPOINT: IO.Larry.VendorSync.dll
    Database__MainDatabaseName: '#{Database__MainDatabaseName}'
    Database__VendorCollection: '#{Database__VendorCollection}'
    Database__MaxConnectionPoolSize: '#{Database__MaxConnectionPoolSize}'
    LARRY_XPM_API: '#{LARRY_XPM_API}'
  secretVars:
    LARRY_XPM_API: '#{LARRY_XPM_API}'
