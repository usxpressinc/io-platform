---
name: io-common-api
octopus:
  space: USXpress
  group: io
tags:
  owner: USXpress
  team: Platform
  purpose: Email and Context services (internal)
infrastructure:
  auth:
    roles:
      - io-common-reader
      - io-common-writer
    group_roles_assignment:
      - name: Everybody
        roles:
          - io-common-reader
          - io-common-writer
    redirect_uri_paths:
      - path: /signin-oidc
        type: api
      - path: /swagger/oauth2-redirect.html
        type: spa
  mongodb:
    atlas:
      user:
        cluster:
          project: mongodb
          group: enterprise
          env: '#{Mongo__Env}'
        roles:
          - name: readWrite
            database: '#{Database__MainDatabaseName}'
            collection: '#{Database__ContextCollection}'
  kafka:
    topics:
      - name: io:email_notification_evt
        bounded_context: io
        schema_type: json
        reference: email-notifications
    service_account: io
api:
  routes:
    subdomains:
      - product: io
        app: common
        type: api
  global:
    upstream:
      perTryTimeout: 15s
  service:
    targetPort: 8080
  configVars:
    APPLICATION_ENTRYPOINT: IO.Common.dll
    Serilog__MinimumLevel__Default: Information
    Database__MainDatabaseName: '#{Database__MainDatabaseName}'
    Database__ContextCollection: '#{Database__ContextCollection}'
    Database__MaxConnectionPoolSize: '#{Database__MaxConnectionPoolSize}'
    EMAIL_SIGNATURELOGOURL: '#{EMAIL_SIGNATURELOGOURL}'
    GET_DRIVER_HOST: '#{GET_DRIVER_HOST}'
    GET_DRIVER_AUTH: '#{GET_DRIVER_AUTH}'
  secretVars:
    AUTH__CLIENT_SECRET: '#{AUTH__CLIENT_SECRET}'
    EMAIL_SENDGRIDKEY: '#{EMAIL_SENDGRIDKEY}'
