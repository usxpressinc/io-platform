---
name: io-lea-jobs-handler
octopus:
  space: USXpress
  group: io
tags:
  owner: USXpress
  team: Platform
  purpose: Job search background processing
infrastructure:
  kafka:
    topics:
      - name: io:job_search_evt
        bounded_context: io
        schema_type: json
        reference: job-processing
    service_account: io
    consumer_group:
      enabled: true
      suffix: "#{consumer_group_suffix}"
  mongodb:
    atlas:
      user:
        cluster:
          project: mongodb
          group: enterprise
          env: '#{Mongo__Env}'
        roles:
          - name: readWrite
            database: '#{Database__MainDatabaseName}'
            collection: '#{Database__JobCollection}'
handler:
  service:
    targetPort: 8080
  configVars:
    APPLICATION_ENTRYPOINT: IO.Lea.JobsHandler.dll
    Database__MainDatabaseName: '#{Database__MainDatabaseName}'
    Database__JobCollection: '#{Database__JobCollection}'
    Database__MaxConnectionPoolSize: '#{Database__MaxConnectionPoolSize}'
    NORA_GOOGLE_MAPS_KML: '#{NORA_GOOGLE_MAPS_KML}'
    KAFKA__topics_config__job-processing__Serialization: ''
    KAFKA__topics_config__job-processing__TopicAutoOffsetReset: ''
  secretVars:
    NORA_GOOGLE_MAPS_KML: '#{NORA_GOOGLE_MAPS_KML}'
