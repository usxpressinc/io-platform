---
name: io-elsa-api
octopus:
  space: USXpress
  group: io
tags:
  owner: USXpress
  team: Platform
  purpose: Pricing calculation service (internal)
infrastructure:
  auth:
    roles:
      - io-elsa-reader
      - io-elsa-writer
    group_roles_assignment:
      - name: Everybody
        roles:
          - io-elsa-reader
          - io-elsa-writer
    redirect_uri_paths:
      - path: /signin-oidc
        type: api
      - path: /swagger/oauth2-redirect.html
        type: spa
  mongodb:
    atlas:
      user:
        cluster:
          project: mongodb
          group: enterprise
          env: '#{Mongo__Env}'
        roles:
          - name: readWrite
            database: '#{Database__MainDatabaseName}'
            collection: '#{Database__PricingCollection}'
api:
  routes:
    subdomains:
      - product: io
        app: elsa
        type: api
  global:
    upstream:
      perTryTimeout: 15s
  service:
    targetPort: 8080
  configVars:
    APPLICATION_ENTRYPOINT: IO.Elsa.dll
    Serilog__MinimumLevel__Default: Information
    Database__MainDatabaseName: '#{Database__MainDatabaseName}'
    Database__PricingCollection: '#{Database__PricingCollection}'
    Database__MaxConnectionPoolSize: '#{Database__MaxConnectionPoolSize}'
    ELSA_PRICING_API: '#{ELSA_PRICING_API}'
    ONPREM_PROXY: '#{ONPREM_PROXY}'
  secretVars:
    AUTH__CLIENT_SECRET: '#{AUTH__CLIENT_SECRET}'
