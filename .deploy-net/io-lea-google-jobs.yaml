---
name: io-lea-google-jobs
octopus:
  space: USXpress
  group: io
tags:
  owner: USXpress
  team: Platform
  purpose: Scheduled Google Jobs synchronization
infrastructure:
  mongodb:
    atlas:
      user:
        cluster:
          project: mongodb
          group: enterprise
          env: '#{Mongo__Env}'
        roles:
          - name: readWrite
            database: '#{Database__MainDatabaseName}'
            collection: '#{Database__JobCollection}'
cron:
  service:
    targetPort: 8080
  schedule:
    - cron: "0 */30 * * * *"  # Every 30 minutes
      timezone: "America/Chicago"
  configVars:
    APPLICATION_ENTRYPOINT: IO.Lea.GoogleJobs.dll
    Database__MainDatabaseName: '#{Database__MainDatabaseName}'
    Database__JobCollection: '#{Database__JobCollection}'
    Database__MaxConnectionPoolSize: '#{Database__MaxConnectionPoolSize}'
    NORA_GOOGLE_MAPS_KML: '#{NORA_GOOGLE_MAPS_KML}'
  secretVars:
    NORA_GOOGLE_MAPS_KML: '#{NORA_GOOGLE_MAPS_KML}'
