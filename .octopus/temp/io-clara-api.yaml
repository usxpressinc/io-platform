# IO.Clara API Deployment Configuration
# Subdomain: api.io.clara

name: io-clara-api
octopus:
  space: USXpress
  group: io

infrastructure:
  mongodb:
    atlas:
      user:
        cluster:
          project: mongodb
          group: enterprise
          env: "#{Mongo__Env}"
        roles:
          - name: readWrite
            database: '#{Clara__DatabaseName}'
            collection: '#{Clara__CollectionName}'

  auth:
    roles:
      - clara-reader
      - clara-writer
    group_roles_assigment:
      - name: Everybody
        roles:
          - clara-reader
          - clara-writer
    redirect_uri_paths:
      - path: /signin-oidc
        type: api
      - path: /swagger/oauth2-redirect.html
        type: spa
      - path: https://localhost:7224/swagger/oauth2-redirect.html
        type: spa
      - path: /
        type: spa  
api:
  enabled: true
  service:
    targetPort: 8082
  global:
    upstream:
      perTryTimeout: 15s
  configVars:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_URLS: http://+:8082
    KAFKA_BOOTSTRAP_SERVERS: kafka.infra.svc.cluster.local:9092
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.infra.svc.cluster.local:4317
  secretVars:
    HIGHWAY_API_KEY: '#{Octopus.Variable["Highway.ApiKey"]}'
    AUTH__API_TOKEN: '#{Octopus.Variable["Auth.ApiToken"]}'
    AUTH__VALIDATION_ENDPOINT: '#{Octopus.Variable["Auth.ValidationEndpoint"]}'
    AUTH__VALIDATION_TOKEN: '#{Octopus.Variable["Auth.ValidationToken"]}'
    XAUTH_MASTER_TOKEN: '#{Octopus.Variable["XAuth.MasterToken"]}'
