    MCLEOD_COMPANY: TMS2
    MCLEOD_BASE_URL: https://mcleod.knightswiftlogistics.com
  secretVars:
    HIGHWAY_API_KEY: ''
    MCLEOD_AUTH: ''
  global:
    upstream:
      perTryTimeout: 10s
  routes:
    subdomains:
      - type: api
        app: poc
        product: demo
    public:
      enabled: true
