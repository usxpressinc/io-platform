# IO.Proxy API Gateway Deployment Configuration
# Subdomain: api.io.proxy

name: io-proxy-api
octopus:
  space: io-platform
  group: api-gateway

infrastructure:
  mongodb:
    atlas:
      user:
        cluster:
          project: io-proxy-api
          group: api-gateway
          env: dev
        roles:
          - name: readWrite
            database: io_proxy

api:
  service:
    targetPort: 8080
    subdomain: api.io.proxy
    publicAccess: true
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  health:
    path: /health
    readinessPath: /ready
    livenessPath: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  configVars:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_URLS: http://+:8080
    KAFKA_BOOTSTRAP_SERVERS: kafka.infra.svc.cluster.local:9092
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.infra.svc.cluster.local:4317
  secretVars:
    XAUTH_MASTER_TOKEN: '#{Octopus.Variable["XAuth.MasterToken"]}'
  
