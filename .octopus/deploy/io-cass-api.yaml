# IO.Cass API Deployment Configuration
# Subdomain: api.io.cass

name: io-cass-api
octopus:
  space: io-platform
  group: carrier-vetting

infrastructure:
  mongodb:
    atlas:
      user:
        cluster:
          project: io-cass-api
          group: carrier-vetting
          env: dev
        roles:
          - name: readWrite
            database: io_cass

api:
  service:
    targetPort: 8082
    subdomain: io-cass
    publicAccess: false
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  health:
    path: /health
    readinessPath: /ready
    livenessPath: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  configVars:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_URLS: http://+:8082
    KAFKA_BOOTSTRAP_SERVERS: kafka.infra.svc.cluster.local:9092
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.infra.svc.cluster.local:4317
  secretVars:
    HIGHWAY_API_KEY: '#{Octopus.Variable["Highway.ApiKey"]}'
    MCLEOD_API_KEY: '#{Octopus.Variable["McLeod.ApiKey"]}'
    XAUTH_MASTER_TOKEN: '#{Octopus.Variable["XAuth.MasterToken"]}'
  
