services:
  # Infrastructure Services
  mongodb:
    image: mongo:7.0
    container_name: io-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: io-platform
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - io-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: io-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    depends_on:
      - zookeeper
    networks:
      - io-network
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list
      interval: 30s
      timeout: 10s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: io-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - io-network

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.88.0
    container_name: io-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics
      - "8889:8889"   # Prometheus exporter
    volumes:
      - ./config/otel-collector.yml:/etc/otel-collector-config.yml:ro
    command: ["--config=/etc/otel-collector-config.yml"]
    networks:
      - io-network
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v2.40.0
    container_name: io-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - io-network

  grafana:
    image: grafana/grafana:10.0.0
    container_name: io-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - io-network
    depends_on:
      - prometheus

  # IO Platform Services
  io-proxy:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: io-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env.io-proxy
    depends_on:
      - mongodb
      - kafka
      - otel-collector
    networks:
      - io-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  io-common:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: io-common
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - .env.io-common
    depends_on:
      - mongodb
      - kafka
      - otel-collector
    networks:
      - io-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  io-clara:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: IO.Clara
    container_name: io-clara
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file:
      - .env.io-clara
    depends_on:
      - mongodb
      - kafka
      - otel-collector
    networks:
      - io-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  io-elsa:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: IO.Elsa
    container_name: io-elsa
    restart: unless-stopped
    ports:
      - "8083:8083"
    env_file:
      - .env.io-elsa
    depends_on:
      - mongodb
      - kafka
      - otel-collector
    networks:
      - io-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Nginx Reverse Proxy for subdomain routing
  nginx:
    image: nginx:1.24-alpine
    container_name: io-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - io-proxy
      - io-common
      - io-clara
      - io-elsa
    networks:
      - io-network

volumes:
  mongodb_data:
  prometheus_data:
  grafana_data:

networks:
  io-network:
    driver: bridge
