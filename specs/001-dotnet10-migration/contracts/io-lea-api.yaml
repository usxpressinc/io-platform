# IO.Lea API Contract
# Job Search Service

openapi: 3.0.3
info:
  title: IO.Lea API
  version: 1.0.0
  description: |
    Job search service for IO Platform. Job posting management with
    geographic polygon matching and Google Jobs integration.

servers:
  - url: https://api.io.lea
    description: Production
  - url: http://localhost:8085
    description: Local Development

paths:
  /health:
    get:
      summary: Service health check
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy

  /ready:
    get:
      summary: Readiness probe
      tags:
        - Health
      responses:
        '200':
          description: Service is ready

  /api/jobs:
    get:
      summary: Search job postings
      description: Search jobs with location and filter criteria
      operationId: searchJobs
      tags:
        - Jobs
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: zipCode
          in: query
          schema:
            type: string
        - name: isRemote
          in: query
          schema:
            type: boolean
        - name: jobType
          in: query
          schema:
            type: string
            enum: [full-time, part-time, contract]
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, filled, expired]
            default: active
        - name: latitude
          in: query
          schema:
            type: number
        - name: longitude
          in: query
          schema:
            type: number
        - name: radius
          in: query
          schema:
            type: number
            default: 25
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSearchResponse'

    post:
      summary: Create job posting
      operationId: createJob
      tags:
        - Jobs
      security:
        - bearerAuth: [io:lea:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPosting'
        '400':
          description: Invalid request

  /api/jobs/{id}:
    get:
      summary: Get job by ID
      operationId: getJob
      tags:
        - Jobs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPosting'
        '404':
          description: Job not found

    put:
      summary: Update job posting
      operationId: updateJob
      tags:
        - Jobs
      security:
        - bearerAuth: [io:lea:write]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobRequest'
      responses:
        '200':
          description: Job updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPosting'
        '404':
          description: Job not found

    delete:
      summary: Delete job posting
      operationId: deleteJob
      tags:
        - Jobs
      security:
        - bearerAuth: [io:lea:admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Job deleted
        '404':
          description: Job not found

  /api/jobs/{id}/publish:
    post:
      summary: Publish job to Google Jobs
      description: Publish or update job posting on Google Jobs
      operationId: publishToGoogleJobs
      tags:
        - Jobs
      security:
        - bearerAuth: [io:lea:write]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  googleJobsId:
                    type: string
                  publishedAt:
                    type: string
                    format: date-time
        '404':
          description: Job not found
        '422':
          description: Unable to publish - missing required fields

  /api/jobs/{id}/fill:
    post:
      summary: Mark job as filled
      operationId: fillJob
      tags:
        - Jobs
      security:
        - bearerAuth: [io:lea:write]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job marked as filled
        '404':
          description: Job not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    JobSearchResponse:
      type: object
      required:
        - jobs
        - totalCount
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobPosting'
        totalCount:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    JobPosting:
      type: object
      required:
        - id
        - jobId
        - title
        - description
        - location
        - jobType
        - category
        - status
      properties:
        id:
          type: string
        jobId:
          type: string
        title:
          type: string
        description:
          type: string
        requirements:
          type: array
          items:
            type: string
        location:
          $ref: '#/components/schemas/JobLocation'
        jobType:
          type: string
          enum: [full-time, part-time, contract]
        category:
          type: string
        salaryRange:
          $ref: '#/components/schemas/SalaryRange'
        benefits:
          type: array
          items:
            type: string
        applicationUrl:
          type: string
        postedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, filled, expired, draft]
        googleJobsId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JobLocation:
      type: object
      required:
        - city
        - state
      properties:
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        isRemote:
          type: boolean
          default: false

    SalaryRange:
      type: object
      properties:
        min:
          type: number
        max:
          type: number
        currency:
          type: string
          default: USD
        period:
          type: string
          enum: [hour, day, week, month, year]

    CreateJobRequest:
      type: object
      required:
        - jobId
        - title
        - description
        - location
        - jobType
        - category
      properties:
        jobId:
          type: string
        title:
          type: string
        description:
          type: string
        requirements:
          type: array
          items:
            type: string
        location:
          $ref: '#/components/schemas/JobLocation'
        jobType:
          type: string
          enum: [full-time, part-time, contract]
        category:
          type: string
        salaryRange:
          $ref: '#/components/schemas/SalaryRange'
        benefits:
          type: array
          items:
            type: string
        applicationUrl:
          type: string
        expiresAt:
          type: string
          format: date-time

    UpdateJobRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        requirements:
          type: array
          items:
            type: string
        location:
          $ref: '#/components/schemas/JobLocation'
        salaryRange:
          $ref: '#/components/schemas/SalaryRange'
        benefits:
          type: array
          items:
            type: string
        applicationUrl:
          type: string
        expiresAt:
          type: string
          format: date-time

