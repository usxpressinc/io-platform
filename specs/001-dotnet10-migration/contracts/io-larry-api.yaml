# IO.Larry API Contract
# Vendor Lookup Service

openapi: 3.0.3
info:
  title: IO.Larry API
  version: 1.0.0
  description: |
    Vendor lookup service for IO Platform. Geographic search and
    scheduled data synchronization for service providers.

servers:
  - url: https://api.io.larry
    description: Production
  - url: http://localhost:8084
    description: Local Development

paths:
  /health:
    get:
      summary: Service health check
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy

  /ready:
    get:
      summary: Readiness probe
      tags:
        - Health
      responses:
        '200':
          description: Service is ready

  /api/vendors/search:
    get:
      summary: Search vendors
      description: Geographic search for service providers
      operationId: searchVendors
      tags:
        - Vendors
      security:
        - bearerAuth: [io:larry:read]
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
        - name: longitude
          in: query
          required: true
          schema:
            type: number
        - name: radius
          in: query
          schema:
            type: number
            default: 50
          description: Search radius in miles
        - name: type
          in: query
          schema:
            type: string
            enum: [carrier, broker, 3pl, warehouse, repair]
        - name: capabilities
          in: query
          schema:
            type: array
            items:
              type: string
        - name: equipmentTypes
          in: query
          schema:
            type: array
            items:
              type: string
        - name: isActive
          in: query
          schema:
            type: boolean
            default: true
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorSearchResponse'

  /api/vendors/{id}:
    get:
      summary: Get vendor by ID
      operationId: getVendor
      tags:
        - Vendors
      security:
        - bearerAuth: [io:larry:read]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vendor retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
        '404':
          description: Vendor not found

  /api/vendors/{vendorId}:
    get:
      summary: Get vendor by vendor ID
      operationId: getVendorByVendorId
      tags:
        - Vendors
      security:
        - bearerAuth: [io:larry:read]
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vendor retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
        '404':
          description: Vendor not found

  /api/vendors/sync:
    post:
      summary: Trigger vendor sync
      description: Manually trigger vendor data synchronization
      operationId: triggerVendorSync
      tags:
        - Vendors
      security:
        - bearerAuth: [io:larry:admin]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorSyncRequest'
      responses:
        '202':
          description: Sync job accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                  status:
                    type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    VendorSearchResponse:
      type: object
      required:
        - vendors
        - totalCount
      properties:
        vendors:
          type: array
          items:
            $ref: '#/components/schemas/Vendor'
        totalCount:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Vendor:
      type: object
      required:
        - id
        - vendorId
        - name
        - type
        - location
        - isActive
      properties:
        id:
          type: string
        vendorId:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [carrier, broker, 3pl, warehouse, repair]
        location:
          $ref: '#/components/schemas/GeoLocation'
        serviceArea:
          $ref: '#/components/schemas/GeoPolygon'
        capabilities:
          type: array
          items:
            type: string
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/VendorContact'
        equipmentTypes:
          type: array
          items:
            type: string
        insuranceInfo:
          $ref: '#/components/schemas/InsuranceInfo'
        rating:
          type: number
          minimum: 0
          maximum: 5
        isActive:
          type: boolean
        lastSyncedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GeoLocation:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
        longitude:
          type: number
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string

    GeoPolygon:
      type: object
      properties:
        type:
          type: string
          default: Polygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number

    VendorContact:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        department:
          type: string

    InsuranceInfo:
      type: object
      properties:
        provider:
          type: string
        policyNumber:
          type: string
        expirationDate:
          type: string
          format: date
        coverageAmount:
          type: number

    VendorSyncRequest:
      type: object
      properties:
        vendorTypes:
          type: array
          items:
            type: string
        forceFullSync:
          type: boolean
          default: false

